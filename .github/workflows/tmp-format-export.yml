name: TEMP format export

# TEMPORARY - removed in the very next commit. See the PR discussion: the
# sandbox this branch is developed in cannot install prettier-plugin-svelte
# (the npm registry returns 403 under an org security policy), so the 12
# .svelte files cannot be formatted or even parsed there. This job runs
# prettier WITH the plugin on a runner that can install it, and prints the
# resulting patch so it can be applied to the branch.

on:
  push:
    branches:
      - claude/optimistic-albattani-mpbv2f

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: Format and export patch
        run: |
          pnpm exec prettier --write . || true
          git diff > /tmp/fmt.diff
          echo "DIFF_BYTES:$(wc -c < /tmp/fmt.diff)"
          echo "DIFF_SHA:$(sha256sum /tmp/fmt.diff | cut -d' ' -f1)"
          echo "FILES_TOUCHED:"
          git diff --name-only
          echo "POST_FORMAT_SHA256:"
          git diff --name-only | while read -r f; do sha256sum "$f"; done
          xz -9e -c /tmp/fmt.diff | base64 -w 120 > /tmp/fmt.b64
          echo "B64_LINES:$(wc -l < /tmp/fmt.b64)"
          echo "B64_SHA:$(sha256sum /tmp/fmt.b64 | cut -d' ' -f1)"
          # Emitted in checksummed chunks: the CI log is the only transport
          # channel available to the sandbox (artifact storage and the npm
          # registry are both blocked by egress policy there), and a silent
          # copying slip in 200+ lines of base64 would be undetectable.
          # Per-chunk digests make any bad chunk identifiable on its own.
          rm -f /tmp/chunk_*
          split -l 12 -d -a 3 /tmp/fmt.b64 /tmp/chunk_
          for f in /tmp/chunk_*; do
            echo "===CHUNK $(basename "$f") sha=$(sha256sum "$f" | cut -d' ' -f1) lines=$(wc -l < "$f")"
            cat "$f"
          done
          echo "===PAYLOAD-COMPLETE"

      # Kept as a convenience for a human reading this run; the sandbox
      # itself cannot fetch it (artifact blob storage is 403 there).
      - uses: actions/upload-artifact@v4
        with:
          name: fmt-patch
          path: /tmp/fmt.diff
