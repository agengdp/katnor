name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # NOTE: no pnpm-lock.yaml is committed yet (Phase 0 scaffold only), so we
      # cannot use --frozen-lockfile, and actions/setup-node's own `cache: pnpm`
      # option requires one too - it hashes the lockfile to key the cache and
      # hard-fails ("Dependencies lock file is not found") without it, which is
      # exactly what broke every run of this workflow so far. Once a lockfile
      # is committed: add `cache: pnpm` back here, and switch the install step
      # below to `pnpm install --frozen-lockfile`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # A real Postgres, because the first-run bootstrap cannot be checked
  # without one. `createFirstUser` is the security boundary of the browser
  # setup wizard and leans on `pg_advisory_xact_lock` inside a drizzle
  # transaction; no mock can tell you whether that lock actually
  # serialises anything. This job is also the only place the migration
  # chain (generate -> migrate -> post-migrate) is ever executed.
  #
  # Separate from the `ci` job above rather than bolted onto it: that job
  # needs no services and should stay fast, and a red build here means
  # something quite different from a failing typecheck.
  db:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The same image docker-compose.yml uses - plain `postgres:16`
        # would pass the migrations and then fail db:post-migrate on
        # `CREATE EXTENSION vector`, which is exactly the kind of drift
        # between CI and the real stack worth not having.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: katnor
          POSTGRES_PASSWORD: katnor
          POSTGRES_DB: katnor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katnor -d katnor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://katnor:katnor@localhost:5432/katnor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      # Regenerates from the schema and fails if the result differs from
      # what is committed. Deployed images apply the committed SQL and
      # cannot generate it, so committed-but-stale migrations mean a deploy
      # that silently brings up the wrong schema. This is the check that
      # makes the committed files trustworthy.
      - name: Check committed migrations match the schema
        run: |
          set -euo pipefail
          pnpm --filter @katnor/db db:generate
          if ! git diff --quiet -- packages/db/drizzle; then
            echo "::error::packages/db/drizzle is out of date - run 'pnpm --filter @katnor/db db:generate' and commit the result"
            git diff --stat -- packages/db/drizzle
            git diff -- packages/db/drizzle
            exit 1
          fi
          echo "committed migrations match src/schema"

      # Before migrate, not after: the tables have vector(1536) columns and
      # Postgres cannot parse that type until the extension exists.
      - name: Pre-migrate (pgvector extension)
        run: pnpm --filter @katnor/db db:pre-migrate

      # `db:migrate:apply`, not `db:migrate`: this is drizzle-orm's own
      # migrator, which is the code path a deployed stack actually runs
      # (there is no drizzle-kit in the server image). Testing the dev CLI
      # here and shipping the other one would leave the deploy path
      # unexercised.
      - name: Migrate (the same path deployments use)
        run: pnpm --filter @katnor/db db:migrate:apply

      - name: Post-migrate (event notify trigger)
        run: pnpm --filter @katnor/db db:post-migrate

      - name: Verify first-run bootstrap
        run: pnpm --filter @katnor/db db:verify

      # Only on failure, and only to show what the drift check saw - the
      # migrations are committed now, so there is nothing to collect from a
      # green run.
      - name: Upload migrations on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migrations
          path: packages/db/drizzle
          if-no-files-found: warn

  # Builds the server image and runs the deploy-time migration inside it,
  # against a real Postgres.
  #
  # The `db` job above proves the migration chain works when run from a
  # checkout with pnpm and the full dev toolchain. A deployment has none of
  # that: docker-compose.prod.yml's `migrate` service runs `npx tsx` inside
  # the built image, which carries only runtime dependencies and whatever
  # `COPY --from=builder /repo/packages` happened to bring along. Those are
  # different enough that "works in the db job" says very little about
  # "works on a deploy", and every bug found in this area got in exactly
  # that way - by testing one path and shipping another.
  #
  # So this runs the literal command from the compose file.
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: katnor
          POSTGRES_PASSWORD: katnor
          POSTGRES_DB: katnor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katnor -d katnor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Loaded into the local daemon rather than pushed - nothing is
      # published from a branch build.
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: katnor-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # Byte-for-byte the `migrate` service's working_dir and command in
      # docker-compose.prod.yml. If that command cannot resolve tsx, or the
      # image is missing packages/db/drizzle, this is where it shows -
      # rather than on someone's server.
      - name: Run the deploy migration inside the image
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql://katnor:katnor@localhost:5432/katnor \
            -w /repo/packages/db \
            katnor-server:ci \
            sh -c "npx tsx src/applyPreMigrate.ts && npx tsx src/migrate.ts && npx tsx src/applyPostMigrate.ts"

      # A second run must be a clean no-op: `docker compose up -d` runs the
      # migrate service on every deploy, so anything non-idempotent here
      # breaks the second deploy rather than the first.
      - name: Run it again to prove it is idempotent
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql://katnor:katnor@localhost:5432/katnor \
            -w /repo/packages/db \
            katnor-server:ci \
            sh -c "npx tsx src/applyPreMigrate.ts && npx tsx src/migrate.ts && npx tsx src/applyPostMigrate.ts"

      - name: Verify the bootstrap against the migrated database
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL=postgresql://katnor:katnor@localhost:5432/katnor \
            -w /repo/packages/db \
            katnor-server:ci \
            npx tsx src/verifyBootstrap.ts

      # Catches interpolation and schema mistakes in the compose file
      # itself - a YAML alias used inside a string, a required variable
      # with no default, a service referencing a volume that is not
      # declared.
      - name: Validate docker-compose.prod.yml
        env:
          POSTGRES_PASSWORD: ci-placeholder
          DATABASE_URL: postgresql://katnor:ci-placeholder@postgres:5432/katnor
          SESSION_SECRET: ci-placeholder
          SETTINGS_ENCRYPTION_KEY: ci-placeholder
          PUBLIC_SERVER_URL: http://localhost:3001
        run: docker compose -f docker-compose.prod.yml config --quiet
