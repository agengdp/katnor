name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # NOTE: no pnpm-lock.yaml is committed yet (Phase 0 scaffold only), so we
      # cannot use --frozen-lockfile, and actions/setup-node's own `cache: pnpm`
      # option requires one too - it hashes the lockfile to key the cache and
      # hard-fails ("Dependencies lock file is not found") without it, which is
      # exactly what broke every run of this workflow so far. Once a lockfile
      # is committed: add `cache: pnpm` back here, and switch the install step
      # below to `pnpm install --frozen-lockfile`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # A real Postgres, because the first-run bootstrap cannot be checked
  # without one. `createFirstUser` is the security boundary of the browser
  # setup wizard and leans on `pg_advisory_xact_lock` inside a drizzle
  # transaction; no mock can tell you whether that lock actually
  # serialises anything. This job is also the only place the migration
  # chain (generate -> migrate -> post-migrate) is ever executed.
  #
  # Separate from the `ci` job above rather than bolted onto it: that job
  # needs no services and should stay fast, and a red build here means
  # something quite different from a failing typecheck.
  db:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The same image docker-compose.yml uses - plain `postgres:16`
        # would pass the migrations and then fail db:post-migrate on
        # `CREATE EXTENSION vector`, which is exactly the kind of drift
        # between CI and the real stack worth not having.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: katnor
          POSTGRES_PASSWORD: katnor
          POSTGRES_DB: katnor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katnor -d katnor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://katnor:katnor@localhost:5432/katnor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      # Regenerates from the schema and fails if the result differs from
      # what is committed. Deployed images apply the committed SQL and
      # cannot generate it, so committed-but-stale migrations mean a deploy
      # that silently brings up the wrong schema. This is the check that
      # makes the committed files trustworthy.
      - name: Check committed migrations match the schema
        run: |
          set -euo pipefail
          pnpm --filter @katnor/db db:generate
          if ! git diff --quiet -- packages/db/drizzle; then
            echo "::error::packages/db/drizzle is out of date - run 'pnpm --filter @katnor/db db:generate' and commit the result"
            git diff --stat -- packages/db/drizzle
            git diff -- packages/db/drizzle
            exit 1
          fi
          echo "committed migrations match src/schema"

      # Before migrate, not after: the tables have vector(1536) columns and
      # Postgres cannot parse that type until the extension exists.
      - name: Pre-migrate (pgvector extension)
        run: pnpm --filter @katnor/db db:pre-migrate

      # `db:migrate:apply`, not `db:migrate`: this is drizzle-orm's own
      # migrator, which is the code path a deployed stack actually runs
      # (there is no drizzle-kit in the server image). Testing the dev CLI
      # here and shipping the other one would leave the deploy path
      # unexercised.
      - name: Migrate (the same path deployments use)
        run: pnpm --filter @katnor/db db:migrate:apply

      - name: Post-migrate (event notify trigger)
        run: pnpm --filter @katnor/db db:post-migrate

      - name: Verify first-run bootstrap
        run: pnpm --filter @katnor/db db:verify

      # Only on failure, and only to show what the drift check saw - the
      # migrations are committed now, so there is nothing to collect from a
      # green run.
      - name: Upload migrations on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migrations
          path: packages/db/drizzle
          if-no-files-found: warn
