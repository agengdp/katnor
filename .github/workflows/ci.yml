name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # NOTE: no pnpm-lock.yaml is committed yet (Phase 0 scaffold only), so we
      # cannot use --frozen-lockfile, and actions/setup-node's own `cache: pnpm`
      # option requires one too - it hashes the lockfile to key the cache and
      # hard-fails ("Dependencies lock file is not found") without it, which is
      # exactly what broke every run of this workflow so far. Once a lockfile
      # is committed: add `cache: pnpm` back here, and switch the install step
      # below to `pnpm install --frozen-lockfile`.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # A real Postgres, because the first-run bootstrap cannot be checked
  # without one. `createFirstUser` is the security boundary of the browser
  # setup wizard and leans on `pg_advisory_xact_lock` inside a drizzle
  # transaction; no mock can tell you whether that lock actually
  # serialises anything. This job is also the only place the migration
  # chain (generate -> migrate -> post-migrate) is ever executed.
  #
  # Separate from the `ci` job above rather than bolted onto it: that job
  # needs no services and should stay fast, and a red build here means
  # something quite different from a failing typecheck.
  db:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The same image docker-compose.yml uses - plain `postgres:16`
        # would pass the migrations and then fail db:post-migrate on
        # `CREATE EXTENSION vector`, which is exactly the kind of drift
        # between CI and the real stack worth not having.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: katnor
          POSTGRES_PASSWORD: katnor
          POSTGRES_DB: katnor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katnor -d katnor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://katnor:katnor@localhost:5432/katnor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      # No migration SQL is committed yet, so this generates it from the
      # drizzle schema on every run. That makes the job prove the schema
      # still produces a clean migration, but it does NOT prove the
      # committed migrations match - there are none to match. Committing
      # the output of this step and switching to a drift check is the
      # follow-up; see docs/DEPLOY.md.
      - name: Generate migrations
        run: pnpm --filter @katnor/db db:generate

      # drizzle-kit printed MODULE_NOT_FOUND for the schema barrel and still
      # exited 0, so the step above went green while emitting a migration
      # with no tables in it. `db:migrate` then reported "migrations applied
      # successfully" for that empty file, and the first honest failure came
      # two steps later, in post-migrate, as `relation "event" does not
      # exist`. A generator that silently produces nothing is the failure
      # mode worth guarding, not the one worth trusting.
      - name: Check the generated migration is not empty
        run: |
          set -euo pipefail
          dir=packages/db/drizzle
          if ! ls "$dir"/*.sql >/dev/null 2>&1; then
            echo "::error::db:generate produced no .sql files in $dir"
            ls -la "$dir" || true
            exit 1
          fi
          tables=$(cat "$dir"/*.sql | grep -c 'CREATE TABLE' || true)
          echo "generated $tables CREATE TABLE statement(s)"
          # 19 tables in packages/db/src/schema today. Asserting a floor
          # rather than the exact count so adding a table does not fail CI,
          # while an empty or near-empty generate still does.
          if [ "$tables" -lt 15 ]; then
            echo "::error::only $tables CREATE TABLE statements generated - the schema did not load"
            cat "$dir"/*.sql
            exit 1
          fi
          for table in event "user" company agent run kg_node; do
            if ! grep -qi "CREATE TABLE \"$table\"" "$dir"/*.sql; then
              echo "::error::no CREATE TABLE for \"$table\" in the generated migration"
              exit 1
            fi
          done

      # Before migrate, not after: the generated tables have vector(1536)
      # columns and Postgres cannot parse that type until the extension
      # exists.
      - name: Pre-migrate (pgvector extension)
        run: pnpm --filter @katnor/db db:pre-migrate

      - name: Migrate
        run: pnpm --filter @katnor/db db:migrate

      - name: Post-migrate (event notify trigger)
        run: pnpm --filter @katnor/db db:post-migrate

      - name: Verify first-run bootstrap
        run: pnpm --filter @katnor/db db:verify

      # Kept so a failed deploy can be reproduced from the exact SQL this
      # run applied, and so the files can be committed without needing a
      # machine that can reach the npm registry.
      - name: Upload generated migrations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-migrations
          path: packages/db/drizzle
          if-no-files-found: warn
