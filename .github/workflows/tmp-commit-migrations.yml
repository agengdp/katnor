name: TEMP commit migrations

# TEMPORARY - removed as soon as it has run once.
#
# `packages/db/drizzle/` has to be committed for deployment to work at all:
# a deployed stack is images and a compose file, and the migrate step
# inside the server image applies the committed SQL (packages/db/src/
# migrate.ts). It cannot generate it - there is no drizzle-kit in the
# runtime image.
#
# The CI `db` job already generates exactly this SQL and proves it: it
# migrates cleanly into a real pgvector Postgres and the first-run
# bootstrap passes 21 assertions against the result. But the generated
# files only exist as a workflow artifact, and this branch's environment
# gets 403 from productionresultssa17.blob.core.windows.net (the artifact
# blob host) under the same organization egress policy that blocks the npm
# registry - so they cannot be fetched and committed from there.
#
# So this job commits them from a runner, which can. Same mechanism the
# repository owner authorized for the .svelte formatting pass, for the
# same reason. It also prints the SQL into the log, which is the one
# channel that does reach the development environment, so the committed
# result can actually be reviewed.

on:
  push:
    branches:
      - claude/optimistic-albattani-mpbv2f

permissions:
  contents: write

jobs:
  commit-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/optimistic-albattani-mpbv2f

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install

      # `db:generate` reads the schema and writes SQL; it never connects.
      # drizzle.config.ts still requires DATABASE_URL to be set, so this is
      # a placeholder rather than a real database.
      - name: Generate migrations
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: pnpm --filter @katnor/db db:generate

      - name: Show what was generated
        run: |
          set -euo pipefail
          echo "--- files ---"
          find packages/db/drizzle -type f | sort
          echo "--- SQL ---"
          cat packages/db/drizzle/*.sql

      # The same floor the CI `db` job enforces. A generator that silently
      # produces nothing must not get committed.
      - name: Refuse to commit an empty migration
        run: |
          set -euo pipefail
          tables=$(cat packages/db/drizzle/*.sql | grep -c 'CREATE TABLE' || true)
          echo "$tables CREATE TABLE statement(s)"
          if [ "$tables" -lt 15 ]; then
            echo "::error::only $tables CREATE TABLE statements - refusing to commit"
            exit 1
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git add packages/db/drizzle
          if git diff --cached --quiet; then
            echo "Nothing to commit - migrations already match the schema."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore(db): commit the generated drizzle migrations" \
            -m "Produced by running pnpm db:generate on a runner. Required for deployment: the migrate step inside the server image applies committed SQL and cannot generate it. The CI db job proves this exact SQL migrates cleanly into a real pgvector Postgres and that the first-run bootstrap passes against the result. Committed from CI because the development environment for this branch gets 403 from the artifact blob host under an organization egress policy, so the generated files could not be fetched and committed from there." \
            -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01SzYhsFjbQVnuQoChdVjVTi"
          git push origin HEAD:claude/optimistic-albattani-mpbv2f
