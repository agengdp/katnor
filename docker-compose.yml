services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katnor}
      POSTGRES_USER: ${POSTGRES_USER:-katnor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katnor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - katnor

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address :9001
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-katnor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-katnor-dev-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - katnor

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://katnor:katnor@postgres:5432/katnor}
      SERVER_PORT: ${SERVER_PORT:-3001}
      # Artifacts v1 (PLAN.md 4.6) - the raw-serving route
      # (apps/server/src/index.ts's `/artifacts/raw/:key`) and every
      # artifacts.* tRPC procedure read through @katnor/artifacts'
      # `getStorage()`, which reads these directly rather than through
      # apps/server's own zod-validated env.ts. Compose defaults to `s3`
      # since minio is already running as a sibling service here;
      # .env.example's own default (for a bare `pnpm dev` with no compose)
      # is `local`.
      ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-s3}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-katnor-artifacts}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-katnor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-katnor-dev-secret}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # The wiki (PLAN.md 4.5) - both server and worker mount the SAME
      # `wiki-data` volume at the same path so either can read/write/commit
      # a project's git-backed wiki directly (@katnor/knowledge's
      # wikiStorage.ts) without going through the other.
      WIKI_STORAGE_DIR: /data/wiki
    volumes:
      - wiki-data:/data/wiki
    ports:
      - "${SERVER_PORT:-3001}:${SERVER_PORT:-3001}"
    networks:
      - katnor

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://katnor:katnor@postgres:5432/katnor}
      ARTIFACT_STORAGE: ${ARTIFACT_STORAGE:-s3}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-katnor-artifacts}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-katnor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-katnor-dev-secret}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      # Workspaces (PLAN.md 4.3) - `SANDBOX_MODE=docker` (the default) makes
      # @katnor/tools' DockerWorkspaceManager start one container per
      # project via the Docker socket mounted below; set `host` to instead
      # use plain local directories under WORKSPACE_HOST_DIR (dev-only, no
      # isolation - see @katnor/tools/src/workspace/host.ts).
      SANDBOX_MODE: ${SANDBOX_MODE:-docker}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-katnor-sandbox:latest}
      WORKSPACE_HOST_DIR: ${WORKSPACE_HOST_DIR:-/tmp/katnor-workspaces}
      # See the server service's identical setting - same volume, same path.
      WIKI_STORAGE_DIR: /data/wiki
    volumes:
      # Lets the worker's dockerode client manage per-project workspace
      # containers on the *host's* Docker daemon (DockerWorkspaceManager -
      # see @katnor/tools/src/workspace/docker.ts) - the worker container
      # itself never runs workloads directly, it only orchestrates sibling
      # containers alongside itself. Grants the worker container
      # effectively root-equivalent control over the host's Docker daemon;
      # acceptable for a self-hosted, single-owner app, same trust model as
      # every other "give the agent runner a Docker socket" tool.
      - /var/run/docker.sock:/var/run/docker.sock
      - wiki-data:/data/wiki
    networks:
      - katnor

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - .env
    environment:
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:3001}
      WEB_PORT: ${WEB_PORT:-3000}
      # adapter-node's built server (apps/web/Dockerfile's runtime image)
      # reads PORT/HOST, not WEB_PORT - keep them in sync so the published
      # port mapping below actually reaches the process inside the container.
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    networks:
      - katnor

volumes:
  postgres-data:
  minio-data:
  wiki-data:

networks:
  katnor:
    driver: bridge
