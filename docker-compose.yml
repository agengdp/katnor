services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katnor}
      POSTGRES_USER: ${POSTGRES_USER:-katnor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katnor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - katnor

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address :9001
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-katnor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-katnor-dev-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - katnor

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://katnor:katnor@postgres:5432/katnor}
      SERVER_PORT: ${SERVER_PORT:-3001}
    ports:
      - "${SERVER_PORT:-3001}:${SERVER_PORT:-3001}"
    networks:
      - katnor

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://katnor:katnor@postgres:5432/katnor}
    networks:
      - katnor

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    env_file:
      - .env
    environment:
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:3001}
      WEB_PORT: ${WEB_PORT:-3000}
      # adapter-node's built server (apps/web/Dockerfile's runtime image)
      # reads PORT/HOST, not WEB_PORT - keep them in sync so the published
      # port mapping below actually reaches the process inside the container.
      PORT: ${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    networks:
      - katnor

volumes:
  postgres-data:
  minio-data:

networks:
  katnor:
    driver: bridge
